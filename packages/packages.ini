# Offline runtime packages for myappx-portable.
# Put the zip files in this folder (packages\). Dest directory names are stable;
# bump the zip filename here when you upgrade. Do not put zips under conf\.
#
# The zip names below are rewritten automatically by bin\update.bat, so a later
# bin\clean.bat + bin\setup.bat installs the same versions the update applied.
#
# JDK zip top folder is versioned (jdk-21.0.x+y); it is unpacked into JDK_DIR.
# PostgreSQL binaries zip already contains pgsql\.
# AppxServer product zip already contains appxserver\ (conf\ is copied on top by bin\setup.bat).
# pgvector zip overlays lib\ + share\ into VECTOR_DEST (the portable pgsql).
# Python zip is the official Windows embeddable (stdlib only; no pip). Assemble uses runtime\python\python.exe.

JDK_ZIP=microsoft-jdk-21.0.13.1-windows-x64.zip
JDK_DIR=runtime\jdk
JDK_MARKER=bin\java.exe

PGSQL_ZIP=postgresql-18.6-3-windows-x64-binaries.zip
PGSQL_DIR=runtime\pgsql
PGSQL_MARKER=bin\postgres.exe

APPX_ZIP=myappxserver-14.0.0.latest-win32.win32.x86_64.zip
APPX_DIR=appxserver
APPX_MARKER=idempiere.ini

VECTOR_ZIP=vector.v0.8.6-pg18.zip
VECTOR_DEST=runtime\pgsql
VECTOR_MARKER=share\extension\vector.control

PYTHON_ZIP=python-3.12.10-embed-amd64.zip
PYTHON_DIR=runtime\python
PYTHON_MARKER=python.exe
