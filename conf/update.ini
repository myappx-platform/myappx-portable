# update.ini - myappx-portable update source.
#
# Leave UPDATE_BASE_URL empty to stay fully offline: bin\update.bat then picks the
# newest zip already present in packages\ and never touches the network.
#
# When UPDATE_BASE_URL is set, update first reads <base>/<manifest> (packages.json)
# and downloads only the packages that are newer than what is installed. If the
# manifest cannot be fetched the update falls back to the local packages\ folder.
#
# The manifest is generated with:
#   powershell -NoProfile -ExecutionPolicy Bypass -File bin\update\make-manifest.ps1 -BaseUrl <base>
#
# UPDATE_OFFLINE=1 forces offline mode even when a base URL is configured.
# UPDATE_KEEP_BACKUPS keeps that many appxserver.bak-* / runtime\backup\<stamp> copies.

UPDATE_BASE_URL=
UPDATE_CHANNEL=latest
UPDATE_MANIFEST=packages.json
UPDATE_OFFLINE=0
UPDATE_KEEP_BACKUPS=3
