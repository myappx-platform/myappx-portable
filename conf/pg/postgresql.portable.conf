# =============================================================================
# myappx-portable PostgreSQL overrides
# =============================================================================
# Edit this file to add or change parameters, then run bin\setup.bat to sync into
# runtime/pgdata/postgresql.portable.conf and restart PostgreSQL.
#
# Rules:
#   - One parameter per line:  name = value
#   - Comments start with #
#   - Blank lines are ignored
#   - Requires PostgreSQL restart (not reload) for most settings
#
# Do not edit runtime/pgdata/postgresql.portable.conf directly; changes will be
# overwritten on the next bin\setup.bat run.
# =============================================================================

# iDempiere/ADempiere restore and migration (default PG is 64)
max_locks_per_transaction = 256

# Examples for future tuning (uncomment as needed):
# shared_buffers = 512MB
# work_mem = 16MB
# maintenance_work_mem = 128MB
# effective_cache_size = 1536MB
